<script>

/* ===== ALGORITHMS (explicit, no built-ins) ===== */
function knapsack(items,cap,vf){const U=100,W=Math.floor(cap/U),n=items.length;let ops=0;const dp=[];for(let i=0;i<=n;i++)dp.push(new Array(W+1).fill(0));
for(let i=1;i<=n;i++){const w=Math.round(items[i-1].price/U),v=vf(items[i-1]);for(let c=0;c<=W;c++){ops++;dp[i][c]=dp[i-1][c];if(w<=c&&dp[i-1][c-w]+v>dp[i][c])dp[i][c]=dp[i-1][c-w]+v}}
const pick=[];let c=W;for(let i=n;i>0;i--){if(dp[i][c]!==dp[i-1][c]){pick.push(i-1);c-=Math.round(items[i-1].price/U)}}
return{dp,W,U,pick:pick.reverse(),ops,states:(n+1)*(W+1)}}
function sortRun(arr,alg,desc,rec){const a=arr.slice();let cmp=0,swp=0;const fr=[];const snap=h=>{if(rec)fr.push({a:a.slice(),h})};
const gt=(x,y)=>{cmp++;return desc?x<y:x>y};snap([]);const n=a.length;
if(alg==='bubble'){for(let i=0;i<n-1;i++)for(let j=0;j<n-1-i;j++){if(gt(a[j],a[j+1])){const t=a[j];a[j]=a[j+1];a[j+1]=t;swp++}snap([j,j+1])}}
else if(alg==='selection'){for(let i=0;i<n-1;i++){let m=i;for(let j=i+1;j<n;j++){if(gt(a[m],a[j]))m=j}if(m!==i){const t=a[i];a[i]=a[m];a[m]=t;swp++}snap([i,m])}}
else if(alg==='insertion'){for(let i=1;i<n;i++){const k=a[i];let j=i-1;while(j>=0&&gt(a[j],k)){a[j+1]=a[j];swp++;j--}a[j+1]=k;snap([j+1])}}
else{const ms=(l,r)=>{if(r-l<1)return;const m=(l+r)>>1;ms(l,m);ms(m+1,r);const L=a.slice(l,m+1),R=a.slice(m+1,r+1);let i=0,j=0,k=l;while(i<L.length&&j<R.length){if(gt(L[i],R[j])){a[k++]=R[j++]}else a[k++]=L[i++];swp++}while(i<L.length){a[k++]=L[i++];swp++}while(j<R.length){a[k++]=R[j++];swp++}snap([l,r])};ms(0,n-1)}
snap([]);return{a,fr,cmp,swp}}
function bsearch(a,t){let lo=0,hi=a.length-1,st=[];while(lo<=hi){const mid=(lo+hi)>>1;st.push({lo,hi,mid});if(a[mid]===t)return{idx:mid,st};if(a[mid]<t)lo=mid+1;else hi=mid-1}return{idx:-1,st}}

try{const d=await api(S.reg?'/register':'/login',{method:'POST',body:{name:n,email:e,password:p}});S.token=d.token;S.server=true;S.user={name:d.user.name};await loadProducts();enter()}
catch(x){if(x instanceof TypeError){er.textContent='Cannot reach the server. Start the backend, or continue in demo mode.';const b=$('#gdm');b.style.display='block';b.onclick=()=>{S.server=false;S.user={name:n||e.split('@')[0]};enter()}}else er.textContent=x.message}}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const o=$('#ov');if(o)o.remove()}});
$('#auth').onclick=authOpen;
$('#lang').innerHTML=VL.map(v=>`<option value="${v[0]}">${v[2]}</option>`).join('');
$('#lang').onchange=e=>{S.lang=e.target.value;render()};
$('#q').oninput=e=>{S.q=e.target.value;S.cat='';S.page==='prod'?render():go('prod')};
$('#mic').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition,vs=$('#vs');if(!SR){vs.textContent='Voice search is not supported in this browser. Try Chrome or Edge.';return}
const r=new SR();r.lang=VL.find(v=>v[0]===S.lang)[1];r.onstart=()=>{vs.textContent='🎤 '+tr('listen');$('#mic').classList.add('rec')};
r.onresult=e=>{const x=e.results[0][0].transcript;$('#q').value=x;S.q=x;S.cat='';go('prod')};
r.onerror=e=>{vs.textContent=e.error==='not-allowed'?'Microphone access is blocked. Allow it in your browser settings and try again.':'Voice search stopped ('+e.error+'). Try again.'};
r.onend=()=>{$('#mic').classList.remove('rec');if(vs.textContent.startsWith('🎤'))vs.textContent=''};try{r.start()}catch(x){vs.textContent='Voice search could not start. Try again.'}};
/* ===== VIEWS ===== */
const spent=()=>[...S.sel].reduce((s,i)=>s+P.find(p=>p.id===i).price,0);
function budgetCard(){const sp=S.res?S.res.pick.reduce((s,i)=>s+P[i].price,0):spent(),pc=Math.min(100,sp/S.budget*100||0),col=pc<50?'var(--ok)':pc<85?'var(--dc)':'var(--er)';
return`<div class="card"><h3>Your shopping budget</h3><div class="row" style="justify-content:space-between"><span><b style="font-size:26px">${fmt(S.budget)}</b><br><span class="mu">Budget</span></span><span><b>${fmt(sp)}</b><br><span class="mu">Spent</span></span><span><b>${fmt(S.budget-sp)}</b><br><span class="mu">Remaining</span></span></div><div class="bar sp"><i style="width:${pc}%;background:${col}"></i></div><div class="mu">${pc.toFixed(1)}% used${sp>S.budget?' — over budget':''}</div></div>`}
function dash(){const r=S.res;return`<div class="grid"><div class="card kpi"><span>💰 Available budget</span><b>${fmt(S.budget)}</b></div><div class="card kpi"><span>🛍 Available products</span><b>${P.length}</b></div><div class="card kpi"><span>🎯 Best value found</span><b class="mono">${r?r.dp[P.length][r.W]:'—'}</b></div><div class="card kpi"><span>💸 Total savings</span><b>${r?fmt(Math.round(r.pick.reduce((s,i)=>s+P[i].price*P[i].discount/100,0))):'—'}</b></div></div><div class="sp">${budgetCard()}</div><h3 class="sp">${tr('offers')}</h3>${offersStrip('')}<div class="grid">${SEC.map(k=>`<div class="card tile" style="--c:${COL[k]}" onclick="S.cat='${k}';go('prod')"><span>${EM[k]}</span><b>${tr(k)}</b></div>`).join('')}</div><div class="card sp"><h3>How it works</h3><p class="mu">Set a budget → choose a goal → run the optimizer and watch 0/1 Knapsack fill its table → explore sorting and binary search on the same catalog → compare measured performance in Analytics.</p><button class="btn p" onclick="go('opt')">Open the optimizer</button></div>`}
function prod(){return`<div class="row" style="margin-bottom:12px"><button class="btn p" onclick="addP()">+ Add product</button><span class="toast" id="er">${S.err}</span></div>${hero()}<div class="grid">${lst().map(p=>`<div class="card pc ${S.sel.has(p.id)?'sel':''}" style="--c:${COL[p.cat]}" onclick="tog(${p.id})"><div class="img">${art(p)}<em class="brand">${p.brand||p.cat}</em></div><b>${p.name}</b><div class="mu">${tr(p.cat)}</div><div class="row sp" style="justify-content:space-between"><span>⭐ ${p.rating}</span><span class="mono">Utility ${p.utility}</span></div><div class="row" style="justify-content:space-between"><b>${fmt(p.price)}</b><span class="tag">${p.discount}% OFF</span></div><div class="mu">Value score: ${vs(p)}</div><div class="row sp"><button class="btn" style="flex:1">${S.sel.has(p.id)?'Selected':'+ Add to selection'}</button><button class="btn" aria-label="Upload photo" title="Upload your own photo" onclick="event.stopPropagation();pickImg(${p.id})">📷</button><button class="btn" aria-label="Delete" onclick="event.stopPropagation();delP(${p.id})">🗑</button></div></div>`).join('')}</div>`}
function tog(i){S.sel.has(i)?S.sel.delete(i):S.sel.add(i);render()}
function delP(i){P=P.filter(p=>p.id!==i);S.sel.delete(i);S.res=null;render();if(S.server)api('/products/'+i,{method:'DELETE'}).catch(()=>{})}
function addP(){const g=t=>prompt(t);const n=g('Product name');if(!n)return;const price=+g('Price in ₹ (multiple of 100)'),rating=+g('Rating (0–5)'),ut=+g('Utility score (0–100)'),d=+g('Discount % (0–90)');
if(!(price>0)||price%100||!(rating>=0&&rating<=5)||!(ut>=0&&ut<=100)||!(d>=0&&d<=90)){S.err='Check the values: price must be a positive multiple of 100, rating 0–5, utility 0–100, discount 0–90%.';return render()}
S.err='';const np={id:Date.now(),name:n,cat:S.cat||'Electronics',brand:'Custom',price,rating,utility:ut,discount:d,icon:'🆕'};P.push(np);S.res=null;render();if(S.server)api('/products',{method:'POST',body:{name:n,category:np.cat,brand:'Custom',price,rating,utility:ut,discount:d,icon:'🆕'}}).then(x=>{np.id=x.product.id}).catch(x=>{S.err='Saved on this page only: '+x.message;render()})}
function opt(){const g=[['rating','⭐','Rating'],['utility','💎','Utility'],['discount','🏷️','Discount'],['combined','📊','Combined value']];
let h=`<div class="row">${g.map(x=>`<button class="goal ${S.obj===x[0]?'on':''}" onclick="S.obj='${x[0]}';S.res=null;render()"><b>${x[1]}</b>${x[2]}<div class="mu">Maximize</div></button>`).join('')}</div>`;
if(S.obj==='combined')h+=`<div class="card sp"><h3>Combined value weights</h3>${[['u','Utility'],['r','Rating'],['d','Discount']].map(k=>`<div class="lbl"><span>${k[1]}</span><b class="mono">${S.w[k[0]]}%</b></div><input type="range" min="0" max="100" value="${S.w[k[0]]}" oninput="setW('${k[0]}',+this.value)" onchange="render()">`).join('')}<div class="lbl"><span>Total</span><b>100%</b></div></div>`;
h+=`<div class="card sp"><div class="row"><label>Budget (₹) <input type="number" id="bud" value="${S.budget}" step="100" min="0" style="width:120px"></label><button class="btn p" onclick="runOpt()">✨ Optimize my cart</button></div><div class="toast">${S.err}</div><div class="mu">Objective: ${S.obj} · Products: ${P.length}</div></div><div class="sp">${budgetCard()}</div>`;
if(S.res)h+=resView();return h}
function setW(k,v){const o=Object.keys(S.w).filter(x=>x!==k),rest=100-v,old=S.w[o[0]]+S.w[o[1]];S.w[k]=v;const a=old?Math.round(S.w[o[0]]/old*rest):rest/2;S.w[o[0]]=a;S.w[o[1]]=rest-a;S.res=null}
function runOpt(){const b=+$('#bud').value;if(!(b>0)||b%100){S.err='Enter a budget above ₹0 in steps of ₹100.';return render()}
S.err='';S.budget=b;const items=P.filter(p=>p.price<=b);if(!items.length){S.err='Every product costs more than this budget. Raise the budget to continue.';S.res=null;return render()}
const t=time(()=>knapsack(items,b,val),20),r=knapsack(items,b,val);r.items=items;r.pick=r.pick.map(i=>P.indexOf(items[i]));r.time=t;S.res=r;S.step=0;S.perf.knap={t,ops:r.ops,n:items.length,states:r.states};S.sel=new Set(r.pick.map(i=>P[i].id));render();play();if(S.server)api('/optimize',{method:'POST',body:{budget:b,objective:S.obj,weights:S.w}}).catch(()=>{})}
function play(){clearInterval(S.timer);S.timer=setInterval(()=>{if(S.step>=S.res.items.length){clearInterval(S.timer);return}S.step++;render()},S.speed)}
function resView(){const r=S.res,n=r.items.length,st=S.step,it=st>0&&st<=n?r.items[st-1]:null;let h='<div class="card sp"><h3>🔬 Live knapsack visualization</h3><div class="row"><button class="btn" onclick="S.res&&play()">▶ Play</button><button class="btn" onclick="clearInterval(S.timer)">⏸ Pause</button><button class="btn" onclick="clearInterval(S.timer);S.step=Math.min(n,S.step+1);render()">⏭ Next step</button><button class="btn" onclick="clearInterval(S.timer);S.step=0;render()">🔄 Reset</button><select onchange="S.speed=+this.value;if(S.timer)play()"><option value="600">Slow</option><option value="250" selected>Normal</option><option value="80">Fast</option></select></div>';
if(it){const w=Math.round(it.price/r.U),v=val(it),c=r.W,ex=r.dp[st-1][c],inc=w<=c?v+r.dp[st-1][c-w]:null;h+=`<p class="sp"><b>Product ${st}: ${it.name}</b> — ${fmt(it.price)}, value ${v}. Evaluated at full budget ${fmt(S.budget)}.</p><div class="dec"><div class="${inc!==null&&inc>ex?'w':''}"><b>INCLUDE</b><br class="mono">${inc===null?'does not fit':v+' + '+r.dp[st-1][c-w]+' = '+inc}</div><div class="${inc===null||ex>=inc?'w':''}"><b>EXCLUDE</b><br class="mono">previous = ${ex}</div></div><b>Decision → ${inc!==null&&inc>ex?'✓ INCLUDE':'✕ EXCLUDE'}</b>`}else if(st===0)h+='<p class="mu">Press play or next step to fill the table one product at a time.</p>';
const done=st>=n;h+=`<div class="scroll sp"><table class="mono"><tr><th>Product \\ Budget</th>${r.dp[0].map((_,c)=>`<th>${c*r.U/1000}K</th>`).join('')}</tr>`;
for(let i=0;i<=Math.min(st,n);i++){h+=`<tr><th>${i?r.items[i-1].name:'None'}</th>${r.dp[i].map((x,c)=>{let k='';if(i===st&&!done)k=c===r.W?'cur':'';if(done&&i===n&&c===r.W)k='pick';return`<td class="${k}">${x}</td>`}).join('')}</tr>`}
return h+'</table></div></div>'+(done?finish():'')}
function finish(){const r=S.res,pk=r.pick.map(i=>P[i]),cost=pk.reduce((s,p)=>s+p.price,0),tv=r.dp[r.items.length][r.W],mx=Math.max(...pk.map(val),1);
return`<div class="card ok sp"><h3>✨ Optimization complete</h3><div class="sg"><div><b class="mono">${tv}</b>Maximum value</div><div><b>${fmt(cost)}</b>Total cost</div><div><b>${fmt(S.budget-cost)}</b>Remaining</div><div><b>${pk.length}</b>Products</div></div><b>✓ OPTIMAL</b></div>
<div class="card sp"><h3>🛒 Selected basket</h3><div class="scroll"><table><tr><th>Product</th><th>Price</th><th>Value</th><th>Rating</th><th>Discount</th><th>Decision</th></tr>${pk.map(p=>`<tr><td>${p.name}</td><td>${fmt(p.price)}</td><td>${val(p)}</td><td>⭐${p.rating}</td><td>${p.discount}%</td><td>✓</td></tr>`).join('')}</table></div><h3 class="sp">Contribution to ${S.obj}</h3>${pk.map(p=>`<div class="pbar"><span>${p.name.split(' ')[0]}</span><div class="bar"><i style="width:${val(p)/mx*100}%;background:var(--ok)"></i></div><b class="mono">${val(p)}</b></div>`).join('')}</div>
<div class="card sp"><h3>💡 Why were these products selected?</h3><p>✓ Total cost stays within your budget.<br>✓ The basket maximizes your chosen objective.<br>✓ Every selected product adds to the final value.<br>✓ The algorithm compared all ${r.states} budget-and-product states, covering every combination implicitly.</p><div class="grid">${pk.map(p=>`<div class="card"><b>${p.name}</b><div class="mu">Cost ${fmt(p.price)}</div><div>Value contribution <b class="mono">+${val(p)}</b></div><div style="color:var(--ok)">✓ Selected</div></div>`).join('')}</div></div>`}
const keys={price:p=>p.price,rating:p=>p.rating,utility:p=>p.utility,discount:p=>p.discount};
function sortv(){const k=S.sk||'price',al=S.sa||'merge',d=S.sd||0;return`<div class="card"><div class="row"><label>Sort by <select onchange="S.sk=this.value;S.sort=null;render()">${Object.keys(keys).map(x=>`<option ${x===k?'selected':''}>${x}</option>`).join('')}</select></label><label>Order <select onchange="S.sd=+this.value;S.sort=null;render()"><option value="0">Lowest → highest</option><option value="1" ${d?'selected':''}>Highest → lowest</option></select></label><label>Algorithm <select onchange="S.sa=this.value;S.sort=null;render()">${['bubble','selection','insertion','merge'].map(x=>`<option value="${x}" ${x===al?'selected':''}>${x[0].toUpperCase()+x.slice(1)} sort</option>`).join('')}</select></label><button class="btn p" onclick="runSort()">Sort now</button></div>
<div class="bars" id="sb">${(S.sort?S.sort.fr[S.sf]:{a:P.map(keys[k]),h:[]}).a.map((v,i,a)=>`<div style="height:${v/Math.max(...a)*92+4}%;${(S.sort?S.sort.fr[S.sf]:{h:[]}).h.includes(i)?'background:var(--dc)':S.sort&&S.sf===S.sort.fr.length-1?'background:var(--ok)':''}"><span>${v}</span></div>`).join('')}</div>
${S.sort?`<div class="sg"><div><b class="mono">${S.sort.cmp}</b>Comparisons</div><div><b class="mono">${S.sort.swp}</b>Swaps / writes</div><div><b class="mono">${S.sort.t.toFixed(3)} ms</b>Execution time</div><div><b class="mono">${S.sf}/${S.sort.fr.length-1}</b>Frame</div></div>`:'<p class="mu">Choose options and press “Sort now” to watch the bars move.</p>'}</div>`}
function runSort(){clearInterval(S.timer);const k=S.sk||'price',al=S.sa||'merge',d=!!S.sd,arr=P.map(keys[k]),r=sortRun(arr,al,d,true);r.t=time(()=>sortRun(arr,al,d,false),200);S.sort=r;S.sf=0;S.perf.sort={t:r.t,ops:r.cmp+r.swp,n:arr.length,cmp:r.cmp,name:al};S.timer=setInterval(()=>{if(S.sf>=r.fr.length-1)return clearInterval(S.timer);S.sf++;render()},120);render()}
function binv(){const sorted=sortRun(P.map(p=>p.price),'merge',false,false).a,s=S.srch;let h=`<div class="card"><h3>🔍 Search products by price</h3><p class="mu">Binary search needs sorted data, so prices are first sorted with merge sort.</p><div class="row"><input type="number" id="tg" placeholder="e.g. 2500" value="${s?s.t:2500}" step="500"><button class="btn p" onclick="runBin()">Search</button></div><div class="toast">${S.err}</div><div class="chips">${(s?sorted:sorted).map((v,i)=>{let c='';if(s){const st=s.r.st[Math.min(S.ss,s.r.st.length-1)];c=i===st.mid?(S.ss===s.r.st.length-1&&s.r.idx>=0?'hit':'mid'):i>=st.lo&&i<=st.hi?'rng':'out'}return`<span class="${c}">${fmt(v)}</span>`}).join('')}</div>`;
if(s){const r=s.r,st=r.st[Math.min(S.ss,r.st.length-1)],last=S.ss>=r.st.length-1;h+=`<p><b>Step ${Math.min(S.ss+1,r.st.length)}:</b> compare ${fmt(sorted[st.mid])} with ${fmt(s.t)} → ${sorted[st.mid]===s.t?'match':sorted[st.mid]<s.t?'search right half':'search left half'}</p>`;if(last)h+=r.idx>=0?'<b style="color:var(--ok)">✓ Target found</b>':'<b style="color:var(--er)">✕ Product not found</b>';h+=`<div class="sg"><div><b class="mono">${Math.min(S.ss+1,r.st.length)}</b>Search steps</div><div><b class="mono">${Math.min(S.ss+1,r.st.length)}</b>Comparisons</div></div><div class="row sp"><button class="btn" onclick="S.ss=Math.min(S.ss+1,S.srch.r.st.length-1);render()">⏭ Next step</button><button class="btn" onclick="S.ss=0;render()">🔄 Reset</button></div>`}
return h+'</div>'}
function runBin(){const t=+$('#tg').value;if(!(t>0)){S.err='Enter a price above ₹0 to search.';return render()}S.err='';const a=sortRun(P.map(p=>p.price),'merge',false,false).a,r=bsearch(a,t);S.perf.bin={t:time(()=>bsearch(a,t),2000),ops:r.st.length,n:a.length};S.srch={t,r};S.ss=0;render()}
function ana(){const p=S.perf;if(!p.knap)runPerf();const rows=[['0/1 Knapsack',p.knap,'DP states: '+p.knap.states],['Sort ('+(p.sort.name)+')',p.sort,'comparisons: '+p.sort.cmp],['Binary search',p.bin,'steps: '+p.bin.ops]],mx=Math.max(...rows.map(r=>r[1].t));
return`<div class="card"><h3>Algorithm performance (measured in your browser)</h3>${rows.map(r=>`<div class="pbar"><span>${r[0]}</span><div class="bar"><i style="width:${Math.max(2,r[1].t/mx*100)}%;background:var(--ac)"></i></div><b class="mono">${r[1].t.toFixed(4)} ms</b></div><div class="mu" style="margin:-2px 0 8px 118px">input size ${r[1].n} · operations ${r[1].ops} · ${r[2]}</div>`).join('')}<button class="btn p" onclick="runPerf();render()">Re-measure</button></div>`}
function runPerf(){const b=S.budget,items=P.filter(p=>p.price<=b),r=knapsack(items,b,val),a=P.map(p=>p.price);S.perf.knap={t:time(()=>knapsack(items,b,val),20),ops:r.ops,n:items.length,states:r.states};const s=sortRun(a,'merge',false,false);S.perf.sort={t:time(()=>sortRun(a,'merge',false,false),200),ops:s.cmp+s.swp,n:a.length,cmp:s.cmp,name:'merge'};const srt=s.a,res=bsearch(srt,srt[3]);S.perf.bin={t:time(()=>bsearch(srt,srt[3]),2000),ops:res.st.length,n:srt.length}}
function cx(){return`<div class="cx">${[['0/1 Knapsack','O(nW)','O(nW)','Fills a table of products × budget slots; each cell picks the better of include or exclude.'],['Binary search','O(log n)','O(1)','Halves the sorted range on every comparison, so 1,000 items need about 10 steps.'],['Merge sort','O(n log n)','O(n)','Splits the list, sorts each half, then merges them in order.'],['Bubble / selection / insertion','O(n²)','O(1)','Simple to follow but slow on large lists, which the Sorting Lab shows through comparison counts.']].map(c=>`<div class="card"><h3>${c[0]}</h3><div class="mono">Time ${c[1]}<br>Space ${c[2]}</div><p class="mu">${c[3]}</p></div>`).join('')}</div>`}
function render(){hdr();const m={dash,prod,off,opt,sort:sortv,bin:binv,ana,cx};const sc=window.scrollY;$('#v').innerHTML=m[S.page]();window.scrollTo(0,sc)}
go('dash');gate();
</script></body></html>
